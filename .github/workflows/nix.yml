name: Nix

on:
  push:
    branches: [master]
    paths: [flake.nix, flake.lock, "nix/**"]
  pull_request:
    paths: [flake.nix, flake.lock, "nix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#default -L
      - run: ./result/bin/localito --help
