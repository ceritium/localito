name: Release

# A v* tag builds every platform and publishes the release; a manual run
# only builds, to try the matrix.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SPINRAIL_VENDOR: ${{ github.workspace }}/.toolchain
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y build-essential pkg-config libsqlite3-dev libssl-dev libyaml-dev
          else
            brew install openssl@3 pkgconf
          fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.0"
          bundler-cache: true
      # spinel and tep take minutes to build; they only change with spinrail.
      - uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ matrix.os }}-${{ hashFiles('Gemfile.lock') }}
      - run: bin/spinrail test
      - id: package
        run: echo "file=$(bin/package "${GITHUB_REF_NAME}" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - run: tar -tzf "${{ steps.package.outputs.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # Points the Homebrew tap and the Nix flake at the new release.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir dist
      - name: Homebrew tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::set the HOMEBREW_TAP_DEPLOY_KEY secret"; exit 1; }
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:ceritium/homebrew-tap.git "$RUNNER_TEMP/tap"
          bin/release-meta "$GITHUB_REF_NAME" dist/SHA256SUMS formula > "$RUNNER_TEMP/tap/Formula/localito.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "localito ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
      - uses: cachix/install-nix-action@v31
      - name: Nix flake
        run: |
          bin/release-meta "$GITHUB_REF_NAME" dist/SHA256SUMS nix > nix/release.json
          nix build .#default -L
          ./result/bin/localito --help
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nix: localito ${GITHUB_REF_NAME#v}" nix/release.json
          git push origin HEAD:master
